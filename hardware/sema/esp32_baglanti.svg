<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" font-family="Helvetica, Arial, sans-serif">
<title>ESP32 modem breadboard bağlantı şeması</title><desc>Verici kartın GPIO25 DAC çıkışı 1 kΩ ve 47 nF RC filtreden, ardından 10 kΩ ile toplama düğümüne gider; GPIO26 gürültü DAC'ı ayrı bir 10 kΩ ile aynı düğüme bağlanır; düğüm 100 nF ile kuplajlanıp 2×100 kΩ bölücüyle 1.65 V'a oturtulur ve alıcı kartın GPIO34 ADC girişine gider. Butonlar ve LED'ler alt kısımda.</desc>
