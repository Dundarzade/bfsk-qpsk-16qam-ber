<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" font-family="Helvetica, Arial, sans-serif">
<title>MCP6002 ile eviren toplayıcı ve 1.65 V referans</title><desc>U1A eviren toplayıcıdır: GPIO25 sinyal DAC'ı ve GPIO26 gürültü DAC'ı 10 kΩ dirençlerle eviren girişe bağlanır, geri besleme 10 kΩ paralel 3.3 nF'tır; artı giriş U1B tamponundan gelen 1.65 V referanstır. Çıkış 100 Ω üzerinden alıcı ESP32'nin GPIO34 girişine gider.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
