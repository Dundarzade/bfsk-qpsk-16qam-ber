<path d="M420 175 L420 275 L520 225 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="430" y="200" font-size="16" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">−</text>
