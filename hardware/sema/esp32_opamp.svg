<path d="M660 225 L665 225 L668 219 L674 231 L680 219 L686 231 L692 219 L695 225 L700 225" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-linejoin="round"/>
<text x="680" y="209" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">R8 100 Ω</text>
<path d="M700 225 L780 225" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linejoin="round"/>
