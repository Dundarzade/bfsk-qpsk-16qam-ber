<text x="280" y="264" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">R3 10 kΩ</text>
<path d="M300 200 L380 200" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linejoin="round"/>
