<path d="M470 455 L520 455 L520 330 L400 330" fill="none" stroke="#444441" stroke-width="1.4" stroke-linejoin="round"/>
<text x="530" y="455" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">VREF = 1.65 V</text>
<rect x="640" y="300" width="330" height="210" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="654" y="318" font-size="14" font-weight="500" fill="#5F5E5A" dominant-baseline="central">Besleme ve pinler (MCP6002, DIP-8)</text>
<rect x="740" y="335" width="130" height="110" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="805" y="350" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">MCP6002</text>
<text x="735" y="370" font-size="11" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">1 OUTA</text>
<text x="875" y="370" font-size="11" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">8 VDD (3V3)</text>
<text x="735" y="390" font-size="11" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">2 INA−</text>
<text x="875" y="390" font-size="11" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">7 OUTB</text>
<text x="735" y="410" font-size="11" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">3 INA+</text>
<text x="875" y="410" font-size="11" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">6 INB−</text>
<text x="735" y="430" font-size="11" font-weight="400" fill="#444441" text-anchor="end" dominant-baseline="central">4 VSS (GND)</text>
<text x="875" y="430" font-size="11" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">5 INB+</text>
<text x="805" y="470" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">VDD–VSS arasına 100 nF, pinlere yakın</text>
<text x="805" y="490" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">3V3 ve GND: ESP32 A'dan</text>
<rect x="30" y="540" width="940" height="160" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="44" y="558" font-size="14" font-weight="500" fill="#5F5E5A" dominant-baseline="central">Denklemler</text>
<text x="50" y="585" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">VOUT = VREF − (Rf/R2)·(V_DAC1 − VREF) − (Rf/R3)·(V_DAC2 − VREF)     →  Rf = R2 = R3 olduğundan: VOUT − 1.65 = −(s(t) + n(t))</text>
<text x="50" y="613" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">fc = 1 / (2π·Rf·Cf) = 1 / (2π · 10 kΩ · 3.3 nF) ≈ 4.8 kHz   →   1 kHz ve 2 kHz tonları geçer, 8 kHz DAC basamakları yumuşar</text>
<text x="50" y="641" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Eviren yapı sinyali 180° çevirir: BFSK'da önemsiz, QPSK / 16-QAM'de preamble ile ölçülen faza zaten dahil olur</text>
<text x="50" y="669" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">DAC'lar 128 kodda (≈1.65 V) dururken VOUT = 1.65 V: kuplaj kondansatörü ve ofset bölücüsü gerekmez</text>
</svg>
