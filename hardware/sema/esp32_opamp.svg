<path d="M228 490 L232 490" fill="none" stroke="#444441" stroke-width="1.2" stroke-linejoin="round"/>
<text x="244" y="467" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">C3 1 µF</text>
<path d="M230 450 L300 450 L300 480 L340 480" fill="none" stroke="#444441" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M340 405 L340 505 L440 455 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="350" y="430" font-size="16" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">−</text>
<text x="350" y="480" font-size="16" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">+</text>
