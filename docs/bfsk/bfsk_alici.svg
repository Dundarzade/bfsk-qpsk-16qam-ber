<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>BFSK korelasyon alıcısı</title><desc>İki korelatör, z1 - z2 farkı ve sıfır eşiği.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="470" fill="#ffffff" rx="10"/>
<rect x="30" y="172" width="80" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="70.0" y="190.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">r(t)</text>
<text x="70.0" y="210.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">s + n</text>
<path d="M110 200 L130 200 L130 110 L152 110" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M130 200 L130 290 L152 290" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="110" y="40" width="120" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="170.0" y="59.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">c₁: cos 2πf₁t</text>
<path d="M170 78 L170 92" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="110" y="322" width="120" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="170.0" y="341.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">c₂: cos 2πf₂t</text>
<path d="M170 322 L170 308" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<circle cx="170" cy="110" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="170" y="110" font-size="16" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">×</text>
<circle cx="170" cy="290" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="170" y="290" font-size="16" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">×</text>
<path d="M186 110 L208 110" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M186 290 L208 290" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="210" y="82" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="305.0" y="100.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">∫₀ᵀᵇ r(t)·c₁(t) dt</text>
<text x="305.0" y="120.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">kodda: sum(r.*c1)</text>
<rect x="210" y="262" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="305.0" y="280.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">∫₀ᵀᵇ r(t)·c₂(t) dt</text>
<text x="305.0" y="300.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">kodda: sum(r.*c2)</text>
<path d="M400 110 L470 110 L470 180" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M400 290 L470 290 L470 220" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="435" y="98" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">z₁</text>
<text x="435" y="304" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">z₂</text>
<text x="482" y="168" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">+</text>
<text x="482" y="232" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">−</text>
<circle cx="470" cy="200" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="470" y="200" font-size="15" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Σ</text>
<path d="M488 200 L518 200" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="520" y="172" width="146" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="593.0" y="190.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">z₁ − z₂ ≷ 0</text>
<text x="593.0" y="210.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">&gt; 0 → 1,  &lt; 0 → 0</text>
<path d="M593 228 L593 252" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="593" y="266" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">bits_hat</text>
<text x="30" y="392" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Bit 1:  z₁ = Eb + n₁,  z₂ = n₂   →   z₁ − z₂ ≈ +Eb</text>
<text x="30" y="414" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Bit 0:  z₁ = n₁,  z₂ = Eb + n₂   →   z₁ − z₂ ≈ −Eb</text>
<text x="30" y="436" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">n₁, n₂ ~ N(0, N0·Tb/4), bağımsız. Hata: gürültü farkı Eb'yi aşıp işareti çevirirse</text>
<text x="30" y="458" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Koherent: Pb = Q(√(Eb/N0))      Non-koherent (|z|): Pb = ½·exp(−Eb/2N0)</text>
</svg>
