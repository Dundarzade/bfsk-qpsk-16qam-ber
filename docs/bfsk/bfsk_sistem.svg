<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" font-family="Helvetica, Arial, sans-serif">
<title>BFSK uçtan uca sistem: verici, AWGN kanal, korelasyon alıcısı</title><desc>Bitler iki tondan biriyle gönderilir, kanalda gürültü eklenir, alıcıda iki korelatör ve z1-z2 farkının işaretiyle karar verilir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="760" fill="#ffffff" rx="10"/>
<rect x="20" y="30" width="500" height="250" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="34" y="48" font-size="14" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">1  Verici</text>
<rect x="40" y="127" width="90" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="85.0" y="145.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">b[n]</text>
<text x="85.0" y="165.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">randi, 10 bit</text>
<path d="M130 155 L158 155" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="210" y="56" width="130" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="275.0" y="73.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">c₁: cos 2πf₁t</text>
<path d="M275 90 L275 125" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="210" y="220" width="130" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="275.0" y="237.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">c₂: cos 2πf₂t</text>
<path d="M275 220 L275 185" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="160" y="127" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="275.0" y="145.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">b = 1 → c₁,   b = 0 → c₂</text>
<text x="275.0" y="165.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">her Tb için bir ton</text>
<path d="M390 155 L408 155" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="410" y="127" width="96" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="458.0" y="145.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">s(t)</text>
<text x="458.0" y="165.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">BFSK</text>
<rect x="540" y="30" width="340" height="250" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="554" y="266" font-size="14" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">2  Kanal (AWGN)</text>
<path d="M506 155 L630 155" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="585" y="52" width="130" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="650.0" y="67.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">n(t)</text>
<text x="650.0" y="87.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">σ² ← Eb/N0</text>
<path d="M650 102 L650 135" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<circle cx="650" cy="155" r="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="650" y="155" font-size="16" font-weight="400" fill="#712B13" text-anchor="middle" dominant-baseline="central">+</text>
<path d="M668 155 L718 155" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="720" y="127" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="790.0" y="145.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">r(t)</text>
<text x="790.0" y="165.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">= s(t) + n(t)</text>
<path d="M790 183 L790 296 L60 296 L60 460 L90 460" fill="none" stroke="#444441" stroke-width="1.2"/>
<rect x="20" y="310" width="860" height="310" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="866" y="330" font-size="14" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">3  Alıcı (korelatör)</text>
<path d="M90 460 L90 390 L132 390" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M90 460 L90 530 L132 530" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="90" y="330" width="120" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="150.0" y="345.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">c₁: cos 2πf₁t</text>
<path d="M150 360 L150 372" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="90" y="560" width="120" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="150.0" y="575.0" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">c₂: cos 2πf₂t</text>
<path d="M150 560 L150 548" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<circle cx="150" cy="390" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="150" y="390" font-size="16" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">×</text>
<circle cx="150" cy="530" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="150" y="530" font-size="16" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">×</text>
<path d="M166 390 L188 390" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M166 530 L188 530" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="190" y="362" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="290.0" y="380.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">∫₀ᵀᵇ r(t)·c₁(t) dt</text>
<text x="290.0" y="400.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">kodda: sum(r_k.*c1)/fs</text>
<rect x="190" y="502" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="290.0" y="520.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">∫₀ᵀᵇ r(t)·c₂(t) dt</text>
<text x="290.0" y="540.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">kodda: sum(r_k.*c2)/fs</text>
<path d="M390 390 L470 390 L470 440" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M390 530 L470 530 L470 480" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="430" y="378" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">z₁</text>
<text x="430" y="544" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">z₂</text>
<text x="482" y="428" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">+</text>
<text x="482" y="492" font-size="13" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">−</text>
<circle cx="470" cy="460" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="470" y="460" font-size="15" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Σ</text>
<path d="M488 460 L528 460" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="508" y="448" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">d</text>
<rect x="530" y="432" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="610.0" y="450.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">d = z₁ − z₂ ≷ 0</text>
<text x="610.0" y="470.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">&gt; 0 → 1,  &lt; 0 → 0</text>
<path d="M690 460 L728 460" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="730" y="432" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="795.0" y="450.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">bits_hat</text>
<text x="795.0" y="470.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">bits ile karşılaştır</text>
<text x="30" y="650" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Verici:  s(t) = cos(2πf₁t) eğer b = 1,  cos(2πf₂t) eğer b = 0,  0 ≤ t &lt; Tb;   Eb = Tb/2</text>
<text x="30" y="672" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Kanal:  N0 = Eb / 10^(EbN0_dB/10),  örnek başına σ = √(N0·fs/2)</text>
<text x="30" y="694" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Alıcı:  bit 1 → z₁ = Eb + n₁, z₂ = n₂ → d ≈ +Eb;   bit 0 → z₁ = n₁, z₂ = Eb + n₂ → d ≈ −Eb</text>
<text x="30" y="716" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Ortogonallik: (f₁ ± f₂)·Tb tam sayı → ∫₀ᵀᵇ c₁c₂ dt = 0;   n₁, n₂ ~ N(0, N0·Tb/4)</text>
<text x="30" y="738" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Hata: n₁ − n₂ işareti çevirirse.   Koherent BFSK: Pb = Q(√(Eb/N0))</text>
</svg>
