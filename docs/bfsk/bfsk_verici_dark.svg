<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>BFSK vericisi</title><desc>Bit değerine göre iki tondan biri seçilir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D3D1C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="470" fill="#0d1117" rx="10"/>
<rect x="30" y="172" width="80" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="70.0" y="190.0" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">b[n]</text>
<text x="70.0" y="210.0" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">bitler</text>
<path d="M110 200 L198 200" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="255" y="60" width="140" height="38" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.8"/>
<text x="325.0" y="79.0" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">c₁: cos 2πf₁t</text>
<path d="M325 98 L325 170" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="255" y="302" width="140" height="38" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.8"/>
<text x="325.0" y="321.0" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">c₂: cos 2πf₂t</text>
<path d="M325 302 L325 230" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="200" y="172" width="250" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="325.0" y="190.0" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">b = 1 → c₁,   b = 0 → c₂</text>
<text x="325.0" y="210.0" font-size="12" font-weight="400" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">her Tb için bir ton seç</text>
<path d="M450 200 L498 200" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="500" y="172" width="166" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.8"/>
<text x="583.0" y="190.0" font-size="14" font-weight="500" fill="#F5C4B3" text-anchor="middle" dominant-baseline="central">s(t)</text>
<text x="583.0" y="210.0" font-size="12" font-weight="400" fill="#F0997B" text-anchor="middle" dominant-baseline="central">kodda: bfsk_mod</text>
<text x="30" y="392" font-size="13" font-weight="400" fill="#D3D1C7" text-anchor="start" dominant-baseline="central">s(t) = cos(2πf₁t) eğer b = 1,   s(t) = cos(2πf₂t) eğer b = 0,   0 ≤ t &lt; Tb</text>
<text x="30" y="414" font-size="13" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Bit enerjisi: Eb = ∫₀ᵀᵇ cos²(2πfᵢt) dt = Tb/2</text>
<text x="30" y="436" font-size="13" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Ortogonallik: (f₁ ± f₂)·Tb tam sayı → ∫₀ᵀᵇ c₁·c₂ dt = 0   (ör. f₁ = 9, f₂ = 3, Tb = 1)</text>
<text x="30" y="458" font-size="13" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Repo: temel bant, bit 0 → −Δf/2, bit 1 → +Δf/2,  Δf = 1/Tb</text>
</svg>
