<text x="805" y="430" font-size="14" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">bits_hat</text>
<text x="20" y="574" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">G (Gray 4-PAM): 00 → −3, 01 → −1, 11 → +1, 10 → +3   |   dilim: 1. bit = (x &gt; 0), 2. bit = (|x| &lt; 2)</text>
<text x="20" y="594" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Kodda temel bant: qam16_mod → awgn_channel → qam16_demod (pam4_slice)</text>
<text x="20" y="614" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Teorik BER (Gray, tam): Pb = ¼·[3Q(x) + 2Q(3x) − Q(5x)],  x = √(4Eb/5N0)</text>
