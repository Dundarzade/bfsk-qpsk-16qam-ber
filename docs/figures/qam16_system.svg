<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" font-family="Helvetica, Arial, sans-serif">
<title>16-QAM verici ve alıcı blok diyagramı</title><desc>Bitler dörder ayrılır, iki Gray 4-PAM seviyesine eşlenir, cos ve -sin taşıyıcılarla toplanır; alıcıda iki korelatör ve 4 seviyeli dilimleyici.</desc>
