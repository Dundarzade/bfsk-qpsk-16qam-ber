<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="Helvetica, Arial, sans-serif">
<title>BFSK korelasyon alıcısı</title>
<desc>Alınan sinyal r(t) iki kola ayrılır, her kolda f1 ve f2 referansıyla çarpılıp bir bit süresi boyunca integre edilir; z1 ve z2'nin farkı sıfırla karşılaştırılarak bit kararı verilir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
<g fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)">
  <path d="M110 160 L130 160 L130 90 L152 90"/>
  <path d="M130 160 L130 230 L152 230"/>
  <line x1="170" y1="58" x2="170" y2="72"/>
  <line x1="170" y1="262" x2="170" y2="248"/>
  <line x1="186" y1="90" x2="208" y2="90"/>
  <line x1="186" y1="230" x2="208" y2="230"/>
  <path d="M340 90 L420 90 L420 140"/>
  <path d="M340 230 L420 230 L420 180"/>
  <line x1="438" y1="160" x2="488" y2="160"/>
  <line x1="560" y1="188" x2="560" y2="222"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
  <rect x="30" y="132" width="80" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="70" y="150" font-size="14" font-weight="500" fill="#444441">r(t)</text>
  <text x="70" y="170" font-size="12" fill="#5F5E5A">s + n</text>

  <rect x="115" y="20" width="110" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="170" y="39" font-size="14" font-weight="500" fill="#085041">c₁: cos 2πf₁t</text>
  <rect x="115" y="262" width="110" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="170" y="281" font-size="14" font-weight="500" fill="#085041">c₂: cos 2πf₂t</text>

  <circle cx="170" cy="90" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="170" y="90" font-size="16" fill="#444441">×</text>
  <circle cx="170" cy="230" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="170" y="230" font-size="16" fill="#444441">×</text>

  <rect x="210" y="62" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="275" y="80" font-size="14" font-weight="500" fill="#3C3489">∫ bir Tb boyunca</text>
  <text x="275" y="100" font-size="12" fill="#534AB7">kodda: sum(r.*c1)</text>
  <rect x="210" y="202" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="275" y="220" font-size="14" font-weight="500" fill="#3C3489">∫ bir Tb boyunca</text>
  <text x="275" y="240" font-size="12" fill="#534AB7">kodda: sum(r.*c2)</text>

  <text x="380" y="74" font-size="14" font-weight="500" fill="#444441">z₁</text>
  <text x="380" y="244" font-size="14" font-weight="500" fill="#444441">z₂</text>
  <text x="436" y="126" font-size="13" fill="#444441">+</text>
  <text x="436" y="194" font-size="13" fill="#444441">−</text>

  <circle cx="420" cy="160" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="420" y="160" font-size="15" fill="#444441">Σ</text>
  <text x="463" y="146" font-size="12" fill="#5F5E5A">z₁−z₂</text>

  <rect x="490" y="132" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="560" y="150" font-size="14" font-weight="500" fill="#712B13">Eşik: 0</text>
  <text x="560" y="170" font-size="12" fill="#993C1D">&gt;0 → 1,  &lt;0 → 0</text>

  <text x="560" y="242" font-size="14" font-weight="500" fill="#444441">b̂ (bits_hat)</text>
</g>
</svg>
